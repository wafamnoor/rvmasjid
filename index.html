:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface2:#F6F2E7; --ink:#221F19; --ink2:#726B57; --line:#E7E0CF;
  --primary:#28468B; --on-primary:#FFFFFF;
  --gold:#B8862A; --gold-soft:#F3E6C4; --gold-ink:#6B4A0D;
  --ok:#236B4C; --ok-bg:#E3EFE4; --danger:#AA3329; --danger-soft:#F8E5E0; --track:#EDE7D8;
  --q1:#DCE6F5; --q2:#B3CBEC; --q3:#82A6DD; --q4:#3E63A9;
  --font-display:'Amiri','Noto Naskh Arabic','Traditional Arabic',serif;
  --font-quran:'Amiri Quran','Amiri','Noto Naskh Arabic','Traditional Arabic',serif;
  --font-ui:'IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16130E; --surface:#1F1B14; --surface2:#2B2519; --ink:#F1EBDA; --ink2:#B5A98D; --line:#3B3324;
    --primary:#8FAAF2; --on-primary:#16130E;
    --gold:#E0B455; --gold-soft:#3A3016; --gold-ink:#F0D48F;
    --ok:#5BC79A; --ok-bg:#173226; --danger:#FF8A80; --danger-soft:#3A1E24; --track:#332C1E;
    --q1:#232C42; --q2:#2E3E63; --q3:#3F5790; --q4:#6C8FDE;
  }
}
:root[data-theme="dark"]{
  --bg:#16130E; --surface:#1F1B14; --surface2:#2B2519; --ink:#F1EBDA; --ink2:#B5A98D; --line:#3B3324;
  --primary:#8FAAF2; --on-primary:#16130E;
  --gold:#E0B455; --gold-soft:#3A3016; --gold-ink:#F0D48F;
  --ok:#5BC79A; --ok-bg:#173226; --danger:#FF8A80; --danger-soft:#3A1E24; --track:#332C1E;
  --q1:#232C42; --q2:#2E3E63; --q3:#3F5790; --q4:#6C8FDE;
}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.7 var(--font-ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
h1,h2,p{margin:0}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:0 20px 120px}
.muted{color:var(--ink2)}

.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;margin:0 -20px;padding-inline:20px;background:var(--bg);border-bottom:1px solid var(--line)}
.who-dd{flex:1;min-width:0}
.who-dd .lbl{font-size:11px;color:var(--ink2);display:block;margin-bottom:5px}
.dd-row{display:flex;gap:8px}
.dd-row select{flex:1;min-width:0;font:700 14.5px var(--font-display);color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:7px 8px;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='%238a8372'><path d='M5 7l5 5 5-5z'/></svg>");background-repeat:no-repeat;background-position:left 6px center;background-size:16px}
.id-badge{flex:none;font:700 13px var(--font-ui);color:var(--ink2);background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:7px 10px;white-space:nowrap}
.att-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.att-btns{display:flex;gap:6px;flex:none}
.att-btn{font:700 13px var(--font-ui);padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);color:var(--ink2)}
.att-btn.present.on{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.att-btn.absent.on{background:var(--danger-soft);color:var(--danger);border-color:var(--danger)}
.pchip2.earned{border-color:var(--gold);color:var(--gold)}
.who .sep{font-style:normal;color:var(--ink2);margin:0 2px}
.stu-group{margin-bottom:18px}
.stu-group-h{font:700 15px var(--font-display);color:var(--ink2);margin-bottom:4px}
.cmp-unit{margin-top:14px}
.cmp-nav{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.cmp-period{font:700 15px var(--font-display);color:var(--ink)}
.cmp-chart{width:100%;height:auto;display:block;margin-top:4px}
.cmp-legend{display:flex;justify-content:center;gap:18px;font-size:12.5px;color:var(--ink2);margin-top:6px}
.cmp-legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.cmp-table{width:100%;border-collapse:collapse;margin-top:18px;font-size:13.5px}
.cmp-table th{text-align:start;color:var(--ink2);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line);font-size:12.5px}
.cmp-table td{padding:9px 4px;border-bottom:1px solid var(--line)}
.cmp-table tr:last-child td{border-bottom:0}
.cmp-table tr.cur td{background:var(--surface2)}
.cmp-table td:first-child{font-weight:700;font-family:var(--font-display);font-size:1.05em}
.cmp-custom{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
.cmp-metrics{display:flex;gap:18px;margin-top:6px}
.cmp-metrics .pk-row{display:flex;align-items:center;gap:6px;padding:0}
.cmp-toolbar{margin:12px 0 4px}
.cmp-toolbar .btn{width:auto;display:inline-flex;padding:9px 16px}
.cmp-chart-title{font:700 16px var(--font-display);margin:0 0 8px;text-align:center}
.who .lbl{font-size:13px;color:var(--ink2)}
.who .nm{font:700 30px/1.2 var(--font-display);display:flex;align-items:center;gap:8px;max-width:100%}
.who .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .nm svg{width:16px;height:16px;flex:none;color:var(--ink2)}
.star{width:34px;height:34px;color:var(--gold);flex:none}

.ring{position:relative;width:min(84vw,340px);aspect-ratio:1/1;margin:14px auto 0}
.ring svg{width:100%;height:100%;display:block;overflow:visible}
.seg-track,.seg-part,.seg-done{fill:none;stroke-width:15}
.seg-track{stroke:var(--track)} .seg-part{stroke:var(--gold)} .seg-done{stroke:var(--primary)}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 20%}
.ring-c .pretag{font-size:13px;color:var(--ink2);margin-bottom:2px}
.ring-c .big{font:700 clamp(48px,15vw,68px)/1 var(--font-display)}
.ring-c .big small{font-size:.42em;margin-inline-start:4px;font-weight:400}
.ring-caption{font-size:14px;color:var(--ink2);line-height:1.6;margin-top:10px;text-align:start}
.legend{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink2);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.hero-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px}
.hero-label{font-size:14px;color:var(--ink2);font-weight:500}
.ring.goal-ring{width:min(62vw,240px);margin-top:8px}
.overall-line{font-size:13.5px;margin-top:8px;line-height:1.6}
.pg-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px 14px;margin-top:20px;font-size:12.5px;color:var(--ink2)}
.pg-legend{display:flex;gap:10px;font-size:11px;flex-wrap:wrap}
.lg{width:8px;height:8px;border-radius:2px;display:inline-block;margin-inline-end:4px}
.lg.done{background:var(--ok)} .lg.part{background:var(--gold)} .lg.none{background:var(--track)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:7px;margin-top:8px}
.bignum{font:700 40px/1 var(--font-display);margin-top:6px}
.bignum small{font-size:.5em;font-weight:400}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:16px}
.rchip{position:relative;min-height:58px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 6px;text-align:center;overflow:hidden}
.rchip.done{background:var(--ok-bg);border-color:var(--ok)}
.rchip.part{border-color:var(--gold)}
.rchip .nm{font:700 14.5px var(--font-display)}
.rchip.done .nm{color:var(--ok)}
.rchip .dt{font-size:10.5px;color:var(--ink2);margin-top:2px}
.rchip.done .dt{color:var(--ok)}
.rchip .rfill{position:absolute;inset-inline-start:0;bottom:0;height:3px;background:var(--gold)}
.rchip .ck2{position:absolute;top:-5px;inset-inline-end:-5px;width:15px;height:15px;background:var(--ok);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center}
.rchip .ck2 svg{width:9px;height:9px}
.pchip{position:relative;min-height:52px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 3px;overflow:hidden}
.pchip.done{background:var(--ok-bg);border-color:var(--ok)}
.pchip.part{background:var(--surface2);border-color:var(--gold)}
.pchip .pn{font-size:10.5px;color:var(--ink2);line-height:1}
.pchip.done .pn{color:var(--ok)}
.pchip .psn{font-family:var(--font-display);font-size:13px;font-weight:700;line-height:1.2;text-align:center;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pchip.done .psn{color:var(--ok)}
.pchip .pfill{position:absolute;inset-inline-start:0;bottom:0;height:3px;background:var(--gold)}
.pchip .ck{position:absolute;top:-5px;inset-inline-end:-5px;width:15px;height:15px;background:var(--ok);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center}
.pchip .ck svg{width:9px;height:9px}
.qwrap{margin-top:14px}
.qbar{display:flex;gap:4px}
.qcell{flex:1;height:10px;background:var(--track);border-radius:4px;overflow:hidden}
.qcell>i{display:block;height:100%;background:var(--gold);border-radius:4px}
.qcell.cur{outline:2px solid var(--primary);outline-offset:2px;border-radius:5px}
.qcell.qsplit{display:flex;gap:2px;background:none;overflow:visible}
.qcell.qsplit>i{flex:1;height:100%;background:var(--track);border-radius:2px;position:relative;overflow:hidden}
.qcell.qsplit>i.done{background:var(--ok)}
.qcell.qsplit>i.part::after{content:'';position:absolute;inset-inline-start:0;top:0;bottom:0;width:var(--p);background:var(--gold)}
.qlabels{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink2);margin-top:6px;gap:4px}
.qlabels span{flex:1;text-align:center}
.sec.secondary .sec-h h2{display:flex;align-items:center;gap:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:20px;border-block:1px solid var(--line)}
.stat{padding:14px 6px;text-align:center}
.stat+.stat{border-inline-start:1px solid var(--line)}
.stat b{display:block;font:700 26px/1.2 var(--font-display)}
.stat b small{font:400 13px var(--font-ui);color:var(--ink2)}
.stat span{font-size:13px;color:var(--ink2)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:14px;border:1px solid transparent;font-weight:600;font-size:16px}
.btn-block{width:100%}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn-danger-fill{background:var(--danger);color:#fff}
.link{background:none;border:0;padding:6px 0;color:var(--primary);font-weight:500;font-size:15px}
.cta{margin-top:22px}
.next{text-align:center;margin-top:10px;font-size:15px;color:var(--ink2)}
.next b{color:var(--ink);font-family:var(--font-display);font-size:1.15em}
.center{text-align:center;margin-top:6px}
.stack{display:grid;gap:10px;margin-top:14px}

.sec{margin-top:30px;padding-top:22px;border-top:1px solid var(--line)}
.sec.first{margin-top:14px;border-top:0;padding-top:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-h h2,.page-h{font:700 24px/1.3 var(--font-display)}
.page-h{padding-top:20px}
.goal-name{font:700 30px/1.3 var(--font-display);margin-top:6px}
.bar{height:8px;background:var(--track);border-radius:4px;overflow:hidden;margin-top:12px}
.bar>i{display:block;height:100%;background:var(--gold);border-radius:4px}
.bar.done>i{background:var(--primary)}
.meta{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--ink2);margin-top:8px}
.fc{margin-top:14px;font-size:15px}
.fcstats{margin-top:14px}
.fcrow{padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.fcrow:last-child{border-bottom:0}
.fcrow .k{color:var(--ink2)}
.fcrow .k::after{content:':'}
.fcrow .v{font-weight:700;font-family:var(--font-display);font-size:1.15em;margin-inline-start:22px}
.fcrow .v small{font-family:var(--font-ui);font-weight:400;color:var(--ink2);font-size:12.5px}
.fc strong{font:700 1.2em var(--font-display)}
.tgt{margin-top:10px;font-size:15px}
.tag{display:inline-block;padding:1px 10px;border-radius:999px;font-size:13.5px;font-weight:600}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.late{background:var(--gold-soft);color:var(--gold-ink)}
.tag.mid{background:var(--surface2);color:var(--ink)}
.done-card{margin-top:12px;background:var(--gold-soft);color:var(--gold-ink);border-radius:14px;padding:16px}
.done-card b{font:700 22px/1.3 var(--font-display);display:block}
.done-card p{margin-top:4px;font-size:15px}
.done-card .btn{margin-top:14px}
.warn{margin-top:14px;background:var(--danger-soft);color:var(--danger);padding:10px 14px;border-radius:12px;font-size:14px}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-top:14px}
.qsec{margin-top:22px}
.qsec:first-of-type{margin-top:10px}
.qsec-h{display:flex;align-items:baseline;gap:10px;padding-inline-start:12px;border-inline-start:5px solid var(--line)}
.qsec-h b{font:700 19px/1.3 var(--font-display)}
.qsec-h span{font-size:12.5px;color:var(--ink2)}
.qsec-h.qc1{border-inline-start-color:var(--q1)}
.qsec-h.qc2{border-inline-start-color:var(--q2)}
.qsec-h.qc3{border-inline-start-color:var(--q3)}
.qsec-h.qc4{border-inline-start-color:var(--q4)}
.tile{position:relative;border:1px solid var(--line);border-radius:14px;padding:14px 6px 10px;text-align:center;
  background:linear-gradient(to top,var(--gold-soft) calc(var(--p) * 1%),var(--surface) calc(var(--p) * 1%));
  min-height:108px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:4px}
.tile.done{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.tile .n{font:700 32px/1 var(--font-display)}
.tile .s{font-size:12px;color:var(--ink2);line-height:1.3}
.tile.done .s{color:inherit;opacity:.85}
.tile .pc{font-size:12.5px;font-weight:600}
.tile.cur{outline:2px solid var(--gold);outline-offset:2px}
.tile .badge{position:absolute;top:6px;inset-inline-start:6px;font-size:10.5px;font-weight:600;background:var(--gold);color:#1a1405;border-radius:6px;padding:0 5px;line-height:1.5}

.rows{list-style:none;margin:8px 0 0;padding:0}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .go{background:none;border:0;padding:0;text-align:start;flex:1;min-width:0}
.row .t{font-weight:500}
.row .t .f{font-family:var(--font-display);font-size:1.15em;font-weight:700}
.row .s{font-size:13px;color:var(--ink2)}
.row .chev{color:var(--ink2);flex:none;width:16px;height:16px}
.empty{margin-top:14px;padding:18px;border:1px dashed var(--line);border-radius:14px;color:var(--ink2);font-size:15px}
.chart{width:100%;height:auto;display:block;margin-top:12px}
.chart-legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink2);margin-top:4px}
.chart-legend span{display:inline-flex;align-items:center;gap:6px}
.chart-legend .lg{width:9px;height:9px;border-radius:2px;display:inline-block}
.pace-title{font:700 21px/1.3 var(--font-display);margin-top:0}
.hcard{margin-top:16px;padding:16px 16px 8px;border-radius:18px;background:var(--surface2);border-top:4px solid var(--line)}
.hcard:first-child{margin-top:14px}
.hcard .sec-h h2{margin-top:0}
.hcard.c-pace{border-top-color:var(--primary)}
.hcard.c-sess{border-top-color:var(--gold)}
.hcard.c-prior{border-top-color:var(--ink2)}
.hcard.c-done{border-top-color:var(--ok)}
.hcard.c-near{border-top-color:var(--primary)}
.hcard.c-far{border-top-color:var(--gold)}
.sec-sub{font-size:12.5px;color:var(--ink2);margin-top:2px}
.progress-line{display:flex;align-items:center;gap:10px;margin-top:14px;padding:10px 12px;background:var(--surface);border-radius:12px;border:1px solid var(--line);font-size:12.5px;color:var(--ink2)}
.progress-line .bar{flex:1;height:7px;margin:0}
.mgroup{margin-top:18px}
.mtitle{font:700 16px var(--font-display);color:var(--primary);display:flex;align-items:center;gap:8px}
.mtitle .cnt{font:400 12px var(--font-ui);color:var(--ink2);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:1px 9px}
.rdel{background:none;border:1px solid var(--line);border-radius:9px;width:32px;height:32px;padding:0;color:var(--danger);display:inline-flex;align-items:center;justify-content:center;flex:none}
.rdel:active{background:var(--track)}
.rdel.sm{width:28px;height:28px;border-radius:8px}
.rdel.sm svg{width:14px;height:14px}
.shist>div{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 0}
.mrow{align-items:center}
.mrow-btn{display:block;width:100%;background:none;border:0;padding:0;text-align:inherit;color:inherit;font:inherit}
.mrow{display:flex;justify-content:space-between;gap:10px;padding:9px 0 9px 14px;border-inline-start:2px solid var(--line);margin-inline-start:6px;margin-top:4px}
.mrow .f{font:700 15px var(--font-display)}
.mrow .d{font-size:12px;color:var(--ink2);flex:none;white-space:nowrap}
.freq{font-size:10.5px;background:var(--surface);border:1px solid var(--line);color:var(--ink2);padding:1px 8px;border-radius:999px;margin-inline-start:4px}
.subhead{font:700 18px/1.3 var(--font-display);margin:20px 0 4px}
.plan{margin-top:12px;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.plan+.plan{margin-top:12px}
.pday{display:flex;width:100%;justify-content:space-between;align-items:baseline;background:var(--primary);color:#fff;border:0;padding:10px 16px;font:inherit;text-align:inherit}
.pday .d{font:700 16px var(--font-display)}
.pday .rel{font-size:11px;opacity:.85}
.pitems{background:var(--surface2);padding:2px 16px 8px}
.pitem{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.pitem:last-child{border-bottom:0}
.pitem-main{display:flex;align-items:baseline;gap:9px;flex:1;min-width:0;background:none;border:0;padding:0;margin:0;text-align:inherit;font:inherit;color:inherit;cursor:pointer}
.pit-label{font-size:12.5px;font-weight:600;flex:none}
.pitem.h .pit-label{color:var(--primary)}
.pitem.r .pit-label{color:var(--gold-ink)}
.pit-range{font:700 16px var(--font-display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pitem.done .pit-range{text-decoration:line-through;opacity:.55}
.pitem .go{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 12px;font-size:11.5px;font-weight:600;flex:none}
.ckdone{width:22px;height:22px;border-radius:50%;background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.ckdone svg{width:12px;height:12px}
.revitem{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.revitem:first-of-type{border-top:0;padding-top:0;margin-top:8px}
.mp-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mp-nav{background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600}
.mp-nav:disabled{opacity:.35}
@keyframes mpfade{from{opacity:.25}to{opacity:1}}
.mp-page.fade{animation:mpfade .16s ease-out}
.mp-pagenum{font:700 15px var(--font-display);color:var(--ink2)}
.mp-page{max-width:480px;margin-inline:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 12px;max-height:50vh;overflow-y:auto;touch-action:pan-y;user-select:none}
.mp-surah-banner{margin:6px 0 8px;padding:8px 8px 2px;line-height:1.5;text-align:center;border:1px solid var(--ink);border-radius:2px}
.mp-surah-txt{display:block;font:700 18px/1.2 var(--font-quran);color:var(--ink);padding:0 0 9px}
.mp-basmala{text-align:center;font:400 19px/1.8 var(--font-quran);margin-bottom:6px;color:var(--ink)}
.mp-line{display:block;white-space:nowrap;text-align:start;font:400 21px/2.1 var(--font-quran);direction:rtl;margin-bottom:1px;color:var(--ink)}
.mp-seg{cursor:pointer;border-radius:5px;padding:0 1px}
.mp-seg:active{background:var(--track)}
.mp-seg.sel{background:var(--track);background:color-mix(in srgb,var(--primary) 22%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--primary) 55%,transparent);padding:.34em 2px;border-radius:6px}
.mp-ayahnum{display:inline-flex;align-items:center;justify-content:center;min-width:1.55em;height:1.55em;padding:0 2px;border:1px solid currentColor;border-radius:50%;font-family:var(--font-ui);font-size:.55em;font-weight:600;vertical-align:middle;margin:0 1px}
.mp-seg.ro{cursor:default}
.mp-seg.mem{background:var(--ok-bg);background:color-mix(in srgb,var(--ok) 20%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--ok) 35%,transparent);padding:.3em 2px;border-radius:6px}
.mp-legend{display:flex;align-items:center;gap:8px;margin:12px 2px 4px;font-size:13px;color:var(--ink2)}
.mp-sw{display:inline-block;width:20px;height:13px;border-radius:4px;background:var(--ok-bg);background:color-mix(in srgb,var(--ok) 20%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--ok) 35%,transparent)}
.mp-sel{margin-top:12px;background:var(--surface2);border-radius:12px;padding:10px 14px}
.mp-sel-row{display:flex;justify-content:space-between;font-size:14px;padding:3px 0}
.mp-sel-row span{color:var(--ink2)}
.scard{margin-top:12px;padding:12px 14px;border-radius:13px;background:var(--surface2);border:1px solid var(--line)}
.scard.done{background:var(--ok-bg);border-color:var(--ok)}
.stop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.snm{font:700 16px var(--font-display)}
.sfreq{font-size:11px;background:var(--surface);border:1px solid var(--line);padding:1px 9px;border-radius:999px;color:var(--ink2);flex:none}
.scard.done .sfreq{background:var(--ok);color:#fff;border-color:var(--ok)}
.shist{margin-top:7px;font-size:12px;color:var(--ink2);line-height:1.9}
.shist b{font-family:var(--font-display);color:var(--ink);font-weight:700}
.srow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow .sf{flex:1;min-width:0}
.srow .f{font:700 16.5px var(--font-display)}
.srow .s{font-size:12px;color:var(--ink2);margin-top:2px}
.mini{min-width:64px;padding:7px 10px;border-radius:10px;border:0;font-size:12.5px;font-weight:600;background:var(--ok-bg);color:var(--ok);flex:none}
.mini.due{background:var(--primary);color:#fff}
.rrow-btn{display:block;width:100%;background:none;border:0;padding:0;text-align:inherit;color:inherit;font:inherit}
.rrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.rrow-btn:last-child .rrow{border-bottom:0}
.rbadge{width:42px;height:42px;border-radius:11px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font:700 17px var(--font-display);flex:none}
.rmain{flex:1;min-width:0;text-align:start}
.rname{font:700 16.5px var(--font-display)}
.rmeta{display:flex;align-items:center;gap:8px;margin-top:4px}
.rbar{flex:1;height:6px;background:var(--track);border-radius:3px;overflow:hidden}
.rbar>i{display:block;height:100%;border-radius:3px}
.rpct{font-size:11px;color:var(--ink2);flex:none}
.rdate{font-size:12px;margin-top:3px}
.rdate.far{color:var(--gold-ink)}
.rdate.ok2{color:var(--ok)}
.chev{color:var(--ink2);flex:none;width:16px;height:16px}
.whole{font-size:10px;background:var(--gold-soft);color:var(--gold-ink);padding:1px 7px;border-radius:999px;margin-inline-start:6px}
.hcard .row{border-bottom-color:var(--line)}
.hcard .row:last-child{border-bottom:0}
.hcard .empty{background:var(--surface);border-color:var(--line)}
.donegrid{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.dchip{min-width:62px;padding:8px 10px 7px;border-radius:12px;background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok);
  display:flex;flex-direction:column;align-items:center;gap:1px}
.dchip .n{font:700 21px/1 var(--font-display)}
.dchip .s{font-size:10.5px;line-height:1.2}
.pchip2{padding:8px 12px;border-radius:12px;background:var(--surface);color:var(--ink);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:flex-start;gap:1px;max-width:100%}
.pchip2 .f{font-family:var(--font-display);font-size:14.5px;font-weight:700}
.pchip2 .s{font-size:10.5px;color:var(--ink2)}
.pace-h{font-size:15.5px;line-height:1.6;margin-top:6px;padding:12px 14px;border-radius:12px;background:var(--surface)}
.pace-h b{font-family:var(--font-display);font-size:1.15em}
.pace-h.fast{background:var(--ok-bg);color:var(--ok)}
.pace-h.slow{background:var(--danger-soft);color:var(--danger)}
.pace-h.ok{background:var(--gold-soft);color:var(--gold-ink)}
.chart text{fill:var(--ink2);font:12px var(--font-ui)}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav[hidden]{display:none}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{background:none;border:0;padding:10px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink2);border-top:3px solid transparent}
.nav button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--primary);border-top-color:var(--gold);font-weight:600}

.backdrop{position:fixed;inset:0;background:rgba(10,16,32,.5);z-index:40}

let MUSHAF_PAGES=null,MUSHAF_LOADING=null;
function loadMushaf(){
  if(MUSHAF_PAGES)return Promise.resolve(MUSHAF_PAGES);
  if(MUSHAF_LOADING)return MUSHAF_LOADING;
  MUSHAF_LOADING=(async()=>{
    if(typeof DecompressionStream==='undefined')throw new Error('unsupported');
    const bin=atob(MUSHAF_GZ),u8=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
    const stream=new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip'));
    MUSHAF_PAGES=JSON.parse(await new Response(stream).text());
    return MUSHAF_PAGES;
  })().catch(e=>{MUSHAF_LOADING=null;throw e;});
  return MUSHAF_LOADING;
}

const $=(s,r)=>(r||document).querySelector(s);

const num=v=>Math.round(v).toLocaleString('en-US');
const dec=(v,k)=>v.toFixed(k);
const pctText=p=>p<=0?'0':p>=100?'100':p<1?dec(p,2):dec(p,1);
const pInt=p=>p>=100?100:p>0?Math.max(1,Math.floor(p)):0;
function parseNum(s){
  const t=String(s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[^\d]/g,'');
  return t?parseInt(t,10):NaN;
}

const pad=n=>String(n).padStart(2,'0');
const toISO=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayISO=()=>toISO(new Date());
const parseISO=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const validDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||'')&&toISO(parseISO(s))===s;
const dayDiff=(a,b)=>Math.round((parseISO(b)-parseISO(a))/86400000);
const addDays=(iso,n)=>{const d=parseISO(iso);d.setDate(d.getDate()+n);return toISO(d);};
const addMonths=(iso,n)=>{const d=parseISO(iso);const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return toISO(d);};
function fmtDate(iso){

}
function fmtShort(iso){

}
const plural=(n,one,two,few,many)=>n===1?one:n===2?two:(n>=3&&n<=10)?n+' '+few:n+' '+many;
const daysText=n=>plural(n,'يوم واحد','يومين','أيام','يومًا');

/* وصف تقريبي لعدد الصفحات بمصطلح "وجه" الشائع في حلقات التحفيظ، بلا أرقام دقيقة */
function wajhCountText(n){
  if(n===1)return 'وجه واحد';
  if(n===2)return 'وجهان';
  if(n>=3&&n<=10)return n+' أوجه';
  return n+' وجهًا';
}
function pagesToWajhText(pages){
  const q=Math.round(pages*4);
  if(q<=0)return 'أقل من ربع وجه';
  const whole=Math.floor(q/4),rem=q%4;
  const fracFull=['','ربع وجه','نصف وجه','ثلاثة أرباع وجه'];
  const fracShort=['','وربع','ونصف','وثلاثة أرباع'];
  if(whole===0)return fracFull[rem];
  if(rem===0)return wajhCountText(whole);
  return wajhCountText(whole)+' '+fracShort[rem];
}

/* عدد الصفحات (كسريًا) الذي يمثله نطاق آيات معيّن، بصرف النظر عن أي سجل آخر */
function pagesOfRange(a,b){
  let s=0;for(let i=a;i<=b;i++)s+=1/PLEN[PAGE_OF[i]];
  return s;
}
/* إجمالي صفحات التسميع (سجلّات الحفظ فقط، لا الحفظ السابق) وصفحات المراجعة لجهة معيّنة خلال فترة */
function placePeriodStats(place,from,to){
  let hifz=0,review=0;
  place.records.forEach(r=>{if(r.type==='session'&&r.date>=from&&r.date<=to)hifz+=pagesOfRange(r.start,r.end);});
  place.reviews.forEach(r=>{if(r.date>=from&&r.date<=to)review+=pagesOfRange(r.start,r.end);});
  return {hifz,review,total:hifz+review};
}
/* فترة الجدول العلوي: أسبوع/شهر/سنة/مخصص (منفصلة تمامًا عن إعدادات رسم "عبر الوقت" أسفله) */
function tablePeriodRange(unit,offset){
  const today=parseISO(todayISO());
  if(unit==='week'){
    const start=new Date(today);start.setDate(start.getDate()-today.getDay()+offset*7);
    const end=new Date(start);end.setDate(end.getDate()+6);
    return {from:toISO(start),to:toISO(end)};
  }
  if(unit==='year'){
    const y=today.getFullYear()+offset;
    return {from:y+'-01-01',to:y+'-12-31'};
  }
  if(unit==='custom'){
    if(UI.tblCustomMode==='count'){
      const n=Math.max(1,Math.min(52,UI.tblCount||4));
      if(UI.tblCountUnit==='month'){
        const start=new Date(today.getFullYear(),today.getMonth()-n+1,1);
        return {from:toISO(start),to:todayISO()};
      }
      const start=new Date(today);start.setDate(start.getDate()-(n*7)+1);
      return {from:toISO(start),to:todayISO()};
    }
    const from=UI.tblFrom||todayISO(),to=UI.tblTo||todayISO();
    return from<=to?{from,to}:{from:to,to:from};
  }
  const start=new Date(today.getFullYear(),today.getMonth()+offset,1);
  const end=new Date(start.getFullYear(),start.getMonth()+1,0);
  return {from:toISO(start),to:toISO(end)};
}
function tablePeriodLabel(unit,offset,r){
  if(unit==='week'){
    if(offset===0)return 'هذا الأسبوع';
    if(offset===-1)return 'الأسبوع الماضي';
    if(offset===1)return 'الأسبوع القادم';
    return fmtShort(r.from)+' – '+fmtShort(r.to);
  }
  if(unit==='year')return r.from.slice(0,4);
  if(unit==='custom')return fmtShort(r.from)+' – '+fmtShort(r.to);
  if(offset===0)return 'هذا الشهر';
  if(offset===-1)return 'الشهر الماضي';
  try{return parseISO(r.from+'').toLocaleDateString('ar-u-nu-latn-ca-gregory',{month:'long',year:'numeric'});}catch(e){return r.from.slice(0,7);}
}

/* أدوات تقسيم الوقت لوحدات (يوم/أسبوع/شهر/سنة) */
function addUnit(date,unit,n){
  const d=new Date(date);
  if(unit==='day')d.setDate(d.getDate()+n);
  else if(unit==='week')d.setDate(d.getDate()+n*7);
  else if(unit==='month')d.setMonth(d.getMonth()+n);
  else d.setFullYear(d.getFullYear()+n);
  return d;
}
function bucketEnd(start,unit){
  if(unit==='day')return new Date(start);
  if(unit==='week'){const e=new Date(start);e.setDate(e.getDate()+6);return e;}
  if(unit==='month')return new Date(start.getFullYear(),start.getMonth()+1,0);
  return new Date(start.getFullYear(),11,31);
}
function bucketLabel(start,unit){
  if(unit==='day'){try{return start.toLocaleDateString('ar-u-nu-latn-ca-gregory',{day:'numeric',month:'short'});}catch(e){return fmtShort(toISO(start));}}
  if(unit==='week')return fmtShort(toISO(start));
  if(unit==='month'){try{return start.toLocaleDateString('ar-u-nu-latn-ca-gregory',{month:'short',year:'2-digit'});}catch(e){return (start.getMonth()+1)+'';}}
  return String(start.getFullYear());
}
const UNIT_SING={day:'يوم',week:'أسبوع',month:'شهر',year:'سنة'},UNIT_PLUR={day:'أيام',week:'أسابيع',month:'أشهر',year:'سنوات'};
function trendBuckets(unit,mode,count,from,to){
  const today=parseISO(todayISO());
  const buckets=[];
  if(mode==='dates'&&from&&to){
    let cur=parseISO(from<=to?from:to);const end=parseISO(from<=to?to:from);
    let guard=0;
    while(cur<=end&&guard<80){
      guard++;
      let bEnd=bucketEnd(cur,unit);if(bEnd>end)bEnd=new Date(end);
      buckets.push({from:toISO(cur),to:toISO(bEnd),label:bucketLabel(cur,unit)});
      cur=addUnit(cur,unit,1);
    }
    return buckets.length?buckets:[{from:toISO(end),to:toISO(end),label:bucketLabel(end,unit)}];
  }
  const n=Math.max(1,Math.min(60,count||8));
  let curStart;
  if(unit==='day')curStart=new Date(today);
  else if(unit==='week'){curStart=new Date(today);curStart.setDate(curStart.getDate()-today.getDay());}
  else if(unit==='month')curStart=new Date(today.getFullYear(),today.getMonth(),1);
  else curStart=new Date(today.getFullYear(),0,1);
  for(let i=n-1;i>=0;i--){
    const start=addUnit(curStart,unit,-i),end=bucketEnd(start,unit);
    buckets.push({from:toISO(start),to:toISO(end),label:bucketLabel(start,unit)});
  }
  return buckets;
}
function trendDurationText(unit,mode,buckets){
  if(mode==='dates')return 'من '+fmtShort(buckets[0].from)+' إلى '+fmtShort(buckets[buckets.length-1].to);
  const n=buckets.length;
  if(n===1)return 'آخر '+UNIT_SING[unit];
  return 'آخر '+num(n)+' '+(n<=10?UNIT_PLUR[unit]:UNIT_SING[unit]);
}

}

const PLACE_COLORS=['var(--primary)','var(--gold)','var(--ok)','#a855c9','#c2410c','#0891b2'];
function trendChartSVG(stu,buckets,metric){
  const n=stu.places.length,W=340,H=220,pl=30,pr=8,pt=14,pb=50;
  const data=buckets.map(b=>({...b,values:stu.places.map(p=>trendMetricValue(placePeriodStats(p,b.from,b.to),metric))}));
  const maxV=Math.max(...data.flatMap(b=>b.values),0.5)*1.15;
  const gw=(W-pl-pr)/data.length,bw=Math.max(3,Math.min(11,(gw*0.72)/n));
  const Y=v=>H-pb-(v/maxV)*(H-pt-pb);
  let axis=`<line x1="${pl}" y1="${pt}" x2="${pl}" y2="${H-pb}" stroke="var(--line)" stroke-width="1"/><line x1="${pl}" y1="${H-pb}" x2="${W-pr}" y2="${H-pb}" stroke="var(--line)" stroke-width="1"/>`;
  for(let t=0;t<=4;t++){
    const v=maxV*t/4,y=Y(v);
    axis+=`<text x="${pl-4}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="7.5" fill="var(--ink2)">${Math.round(v*4)/4}</text>`;
  }
  let bars='',labels='';
  const everyK=Math.max(1,Math.ceil(data.length/9));
  data.forEach((b,bi)=>{
    const cx=pl+gw*bi+gw/2,totalW=bw*n+2*(n-1);
    const x0=cx-totalW/2;
    b.values.forEach((v,pi)=>{
      const x=x0+pi*(bw+2),y=Y(v),ht=Math.max(v>0?2:0,(H-pb)-y);
      bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${ht.toFixed(1)}" rx="2" fill="${PLACE_COLORS[pi%PLACE_COLORS.length]}"/>`;
    });
    if(bi%everyK===0||bi===data.length-1)labels+=`<text x="${cx.toFixed(1)}" y="${(H-pb+11).toFixed(1)}" text-anchor="end" font-size="8.5" transform="rotate(-45 ${cx.toFixed(1)} ${(H-pb+11).toFixed(1)})">${esc(b.label)}</text>`;
  });
  const yTitle=`<text x="9" y="${(H-pb+pt)/2+5}" text-anchor="middle" font-size="9" font-weight="700" fill="var(--ink2)" transform="rotate(-90 9 ${((H-pb+pt)/2+5).toFixed(1)})">عدد الأوجه</text>`;
  const xTitle=`<text x="${(pl+(W-pr))/2}" y="${H-2}" text-anchor="middle" font-size="9" font-weight="700" fill="var(--ink2)">التاريخ</text>`;
  const legend=stu.places.map((p,i)=>`<span><i style="background:${PLACE_COLORS[i%PLACE_COLORS.length]}"></i>${esc(p.name)}</span>`).join('');
  return `<svg class="chart cmp-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="كمية الحفظ عبر الوقت لكل جهة">${axis}${bars}${labels}${yTitle}${xTitle}</svg>
    <div class="cmp-legend">${legend}</div>`;
}

function cleanPlace(p){

    if(!Number.isInteger(a)||!Number.isInteger(b)||a<0||b>=TOTAL||a>b)return;
    const date=okDate(r.date);
    if(type==='session'&&!date)return;
    recs.push({id:String(r.id||uid()),type,start:a,end:b,date:type==='prior'?null:date,createdAt:Number.isFinite(r.createdAt)?r.createdAt:Date.now()});
  });
  const reviews=[];
  (Array.isArray(p.reviews)?p.reviews:[]).forEach(r=>{
    if(!r||typeof r!=='object')return;
    const a=r.start,b=r.end;
    if(!Number.isInteger(a)||!Number.isInteger(b)||a<0||b>=TOTAL||a>b)return;
    const date=okDate(r.date);if(!date)return;
    reviews.push({id:String(r.id||uid()),start:a,end:b,date,createdAt:Number.isFinite(r.createdAt)?r.createdAt:Date.now()});
  });
  const plan=[];
  (Array.isArray(p.plan)?p.plan:[]).forEach(pl=>{
    if(!pl||typeof pl!=='object')return;
    const date=okDate(pl.date);if(!date)return;
    const a=pl.start,b=pl.end;
    if(!Number.isInteger(a)||!Number.isInteger(b)||a<0||b>=TOTAL||a>b)return;
    const kind=pl.kind==='review'?'review':'hifz';
    plan.push({id:String(pl.id||uid()),date,kind,start:a,end:b,done:!!pl.done,createdAt:Number.isFinite(pl.createdAt)?pl.createdAt:Date.now()});
  });
  return {id:String(p.id||uid()),name,goal:{juz:g,target:okDate(p.goal&&p.goal.target)},finalTarget:okDate(p.finalTarget),records:recs,reviews,plan};
}

/* حجز رمز جديد بشكل ذرّي: ينجح فقط إن لم يكن مستخدمًا (يعيد true) وإلا false */
function syncReserve(code){
  const db=fbInit(),ref=syncDocRef(code);
  if(!db||!ref)return Promise.reject(new Error('nofb'));
  return db.runTransaction(async tx=>{
    const snap=await tx.get(ref);
    if(snap.exists)return false;
    tx.set(ref,{data:DATA,updatedAt:Date.now()});
    return true;
  });
}
/* تفعيل المزامنة برمز جديد (من «المزيد») */
function syncCreate(code){
  code=(code||'').trim();
  const bad=syncCodeCheck(code,true);
  if(bad){syncMsg('sync-msg',bad);return;}
  syncMsg('sync-msg','');
  if(!syncDocRef(code)){syncMsg('sync-msg','تعذّر تحميل خدمة المزامنة. تحقّق من الإنترنت.');return;}
  toast('جارٍ التحقق من الرمز...');
  syncReserve(code).then(ok=>{
    if(!ok){syncMsg('sync-msg','هذا الرمز مستخدم بالفعل من شخص آخر. اختر رمزًا مختلفًا.');return;}
    syncStart(code);render();toast('تم تفعيل المزامنة برمزك الجديد.');
  }).catch(()=>syncMsg('sync-msg','تعذّر الاتصال. تحقّق من الإنترنت ثم أعد المحاولة.'));
}
/* الاتصال برمز موجود مسبقًا (بياناته من جهاز آخر) */
function syncConnect(code){
  code=(code||'').trim();
  const bad=syncCodeCheck(code,false);
  if(bad){syncMsg('sync-msg',bad);return;}
  syncMsg('sync-msg','');
  const ref=syncDocRef(code);
  if(!ref){syncMsg('sync-msg','تعذّر تحميل خدمة المزامنة. تحقّق من الإنترنت.');return;}
  toast('جارٍ الاتصال...');
  ref.get().then(snap=>{
    if(snap.exists&&snap.data()&&snap.data().data)openSheet({type:'sync-conflict',code});
    else syncMsg('sync-msg','لا توجد بيانات بهذا الرمز. لإنشاء رمز جديد اضغط «تفعيل برمز جديد».');
  }).catch(()=>syncMsg('sync-msg','تعذّر الاتصال. تحقّق من الإنترنت ثم أعد المحاولة.'));
}
/* تغيير رمز المزامنة: ينقل البيانات لرمز جديد غير مستخدم */
function syncChange(){
  const code=(($('#sc-code')||{}).value||'').trim();
  const bad=syncCodeCheck(code,true);
  if(bad){syncMsg('sc-msg',bad);return;}
  if(code===SYNC_CODE){syncMsg('sc-msg','هذا هو رمزك الحالي بالفعل.');return;}
  syncMsg('sc-msg','');
  const btn=$('#sc-go');if(btn)btn.disabled=true;
  syncReserve(code).then(ok=>{
    if(btn)btn.disabled=false;
    if(!ok){syncMsg('sc-msg','هذا الرمز مستخدم بالفعل من شخص آخر. اختر رمزًا مختلفًا.');return;}
    syncStart(code);closeSheet();render();toast('تم تغيير الرمز. أدخل الرمز الجديد على أجهزتك الأخرى.');
  }).catch(()=>{if(btn)btn.disabled=false;syncMsg('sc-msg','تعذّر الاتصال. تحقّق من الإنترنت ثم أعد المحاولة.');});
}

/* من شاشة الترحيب: استرجاع بيانات موجودة برمز مزامنة، دون إنشاء أي مستند جديد */
function syncJoin(){
  const inp=$('#join-code'),btn=$('#join-go'),code=((inp&&inp.value)||'').trim();
  if(!code){toast('اكتب رمز المزامنة أولًا.');if(inp)inp.focus();return;}
  const ref=syncDocRef(code);
  if(!ref){toast('تعذّر الاتصال بخدمة المزامنة. تحقّق من الإنترنت ومن كتابة الرمز.');return;}
  if(btn)btn.disabled=true;toast('جارٍ البحث عن بياناتك...');
  ref.get().then(snap=>{
    if(btn)btn.disabled=false;
    const remote=snap.exists&&snap.data();
    if(!remote||!remote.data){toast('لا توجد بيانات بهذا الرمز. تأكد من كتابته كما هو تمامًا.');return;}
    const d=cleanData(remote.data);
    if(!d.students.length){toast('الرمز موجود لكن لا يحوي أي طالب.');return;}
    syncApplyingRemote=true;DATA=d;
    try{localStorage.setItem(KEY,JSON.stringify(DATA));}catch(e){}
    syncApplyingRemote=false;
    syncStart(code);UI.tab='home';render();toast('تم استرجاع بياناتك، والمزامنة مفعّلة.');
  }).catch(()=>{if(btn)btn.disabled=false;toast('تعذّر الاتصال. تحقّق من الإنترنت ثم أعد المحاولة.');});
}

/* ═══════════════ الحسابات المشتقة ═══════════════ */
function derive(st){
  const mem=new Uint8Array(TOTAL),jc=new Array(30).fill(0),sc=new Array(114).fill(0),jdone=new Array(30).fill(null);
  const pageMem=new Float64Array(604); // عدد الآيات المحفوظة من كل صفحة
  const recs=st.records.slice().sort((a,b)=>{
    const ka=a.type==='prior'?'':a.date,kb=b.type==='prior'?'':b.date;
    return ka<kb?-1:ka>kb?1:a.createdAt-b.createdAt;
  });
  const perRec={},tl=[],ptl=[],tlById={};
  let total=0,priorTotal=0,pagesTotal=0,priorPagesTotal=0;
  for(const r of recs){
    let added=0;
    for(let i=r.start;i<=r.end;i++){
      if(mem[i])continue;
      mem[i]=1;added++;
      const j=JUZ_OF[i];
      if(++jc[j]===JSIZE[j])jdone[j]={date:r.type==='prior'?null:r.date,id:r.id};
      sc[SURAH_OF[i]]++;
      const p=PAGE_OF[i]; pageMem[p]++; pagesTotal+=1/PLEN[p];
    }
    total+=added; perRec[r.id]=added;
    if(r.type==='prior'){priorTotal=total; priorPagesTotal=pagesTotal;}
    else{const pt={date:r.date,total,pages:pagesTotal,id:r.id};tl.push(pt);ptl.push(pt);tlById[r.id]=pt;}
  }
  let next=-1;
  for(let k=0;k<TOTAL;k++){const i=TRAVERSAL[k];if(!mem[i]){next=i;break;}}
  const juzDone=jdone.filter(Boolean).length;
  let surahDone=0;for(let s=0;s<114;s++)if(sc[s]===COUNTS[s])surahDone++;
  const juzPages=j=>{let s=0;for(let p=JUZ_PAGE0[j];p<JUZ_PAGE0[j]+JUZ_PAGES[j];p++)s+=pageMem[p]/PLEN[p];return s;};
  return {mem,jc,sc,jdone,perRec,tl,ptl,tlById,total,priorTotal,pagesTotal,priorPagesTotal,pageMem,
    pct:total/TOTAL*100,next,juzDone,surahDone,curJuz:next>=0?JUZ_OF[next]:29,juzPages};
}
/* معدل الحفظ الفعلي بالصفحات في آخر نافذة أيام (نافذة 30 يومًا)، ويُستخدم للتوقعين القصير والطويل */
/* ═══════════════ بيانات المراجعة ═══════════════ */
/* قريبة: جلسات حفظ آخر 7 أيام داخل الجزء الذي يعمل عليه الآن (تبقى ظاهرة حتى بعد مراجعتها) */
/* بعيدة: كل جزء محفوظ بالكامل غير الجزء الحالي، مفلترة حسب الفترة المختارة (أسبوع/شهر/3 أشهر) */
function reviewCoverage(reviews,a,b){
  const len=b-a+1,covered=new Uint8Array(len);
  let lastDate=null;
  reviews.forEach(r=>{
    const lo=Math.max(r.start,a),hi=Math.min(r.end,b);
    if(lo>hi)return;
    for(let i=lo;i<=hi;i++)covered[i-a]=1;
    if(!lastDate||r.date>lastDate)lastDate=r.date;
  });
  let cov=0;for(let k=0;k<len;k++)if(covered[k])cov++;
  return {frac:cov/len,lastDate};
}
function monthLabel(mkey){
  const [y,m]=mkey.split('-').map(Number);
  try{return new Date(y,m-1,1).toLocaleDateString('ar-u-nu-latn-ca-gregory',{year:'numeric',month:'long'});}
  catch(e){return mkey;}
}
const REVIEW_PERIODS={week:7,month:30,'3months':90};
function deriveReview(st,d){
  const goalJ=st.goal.juz;
  const nearCov=reviewCoverage(st.reviews,JS[goalJ],JE[goalJ]);
  const nearByMonth={};
  st.reviews.forEach(r=>{
    const lo=Math.max(r.start,JS[goalJ]),hi=Math.min(r.end,JE[goalJ]);
    if(lo>hi)return;
    const mkey=r.date.slice(0,7);
    (nearByMonth[mkey]=nearByMonth[mkey]||[]).push(r);
  });
  const nearMonths=Object.keys(nearByMonth).sort((a,b)=>a<b?1:-1).map(mkey=>({
    mkey,entries:nearByMonth[mkey].slice().sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:b.createdAt-a.createdAt)
  }));

  const days=REVIEW_PERIODS[UI.reviewPeriod||'month'];
  const cutoff=addDays(todayISO(),-(days-1));
  const periodReviews=st.reviews.filter(r=>r.date>=cutoff);
  const far=[];
  for(let j=0;j<30;j++){
    if(j===goalJ||d.jc[j]<JSIZE[j])continue;
    const cov=reviewCoverage(periodReviews,JS[j],JE[j]);
    const cnt=periodReviews.filter(r=>Math.max(r.start,JS[j])<=Math.min(r.end,JE[j])).length;
    far.push({j,pct:cov.frac*100,lastDate:cov.lastDate,cnt});
  }
  far.sort((a,b)=>{
    if(!a.lastDate&&!b.lastDate)return a.j-b.j;
    if(!a.lastDate)return -1;
    if(!b.lastDate)return 1;
    return a.lastDate<b.lastDate?-1:a.lastDate>b.lastDate?1:0;
  });
  return {goalJ,nearCov,nearMonths,far};
}
function paceOf(st,d){
  const sess=st.records.filter(r=>r.type==='session');
  const dates=new Set(sess.map(r=>r.date));
  if(sess.length<3||dates.size<2)return {ok:false,reason:'few'};
  const today=todayISO(),first=[...dates].sort()[0];
  const winStart=dayDiff(first,today)>29?addDays(today,-29):first;
  const inWin=d.ptl.filter(p=>p.date>=winStart);
  if(!inWin.length)return {ok:false,reason:'idle'};
  const before=d.ptl.filter(p=>p.date<winStart);
  const startPages=before.length?before[before.length-1].pages:d.priorPagesTotal;
  const endPages=inWin[inWin.length-1].pages;
  const days=Math.max(1,dayDiff(winStart,today)+1);
  const pages=endPages-startPages;
  if(pages<=0)return {ok:false,reason:'idle'};
  return {ok:true,pagesPerWeek:pages/days*7,days};
}
function firstUnmem(s,d){
  for(let a=1;a<=COUNTS[s-1];a++)if(!d.mem[gi(s,a)])return a;
  return 1;
}

/* أسماء السور الموجودة في صفحة معيّنة (قد تكون أكثر من سورة في صفحات جزء عمّ) */
function surahsOnPage(p){
  const a=PSTART[p],b=a+PLEN[p]-1,out=[];let last=-1;
  for(let i=a;i<=b;i++){const s=SURAH_OF[i];if(s!==last){out.push(s);last=s;}}
  return out;
}

function ringSVG(d){
  const cx=150,cy=150,r=120,seg=12,gap=2.6;
  const pt=(deg,rad)=>{const a=deg*Math.PI/180;return [cx+rad*Math.sin(a),cy-rad*Math.cos(a)];};
  let out='';
  for(let j=0;j<30;j++){
    const [x0,y0]=pt(-(j*seg+gap/2),r),[x1,y1]=pt(-((j+1)*seg-gap/2),r);
    const p=d.jc[j]/JSIZE[j]*100;
    const path=`M${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 0 0 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
    out+=`<path d="${path}" pathLength="100" class="seg-track"/>`;
    if(p>=100)out+=`<path d="${path}" pathLength="100" class="seg-done"/>`;
    else if(p>0)out+=`<path d="${path}" pathLength="100" class="seg-part" stroke-dasharray="${p.toFixed(2)} 100"/>`;
  }
  const [mx,my]=pt(-(d.curJuz*seg+seg/2),r+17);
  out+=`<circle cx="${mx.toFixed(2)}" cy="${my.toFixed(2)}" r="3.6" fill="var(--gold)"/>`;
  return `<svg viewBox="0 0 300 300" role="img" aria-label="حلقة من 30 قطعة، لكل جزء قطعة">${out}</svg>`;
}

/* تنسيق فرق زمني إلى "أسابيع/أشهر" لعرض ودّي */
function catchUpText(remainingPages,daysLeft){
  if(daysLeft<=0)return null;
  const perWeek=remainingPages/daysLeft*7;
  const perDayLines=perWeek/7*LINES_PER_PAGE;
  const wk=perWeek<1?dec(perWeek,1):Math.round(perWeek);
  const ln=Math.round(perDayLines);
  return `${pagesTxt(wk)} في الأسبوع (نحو ${plural(ln,'سطر واحد','سطرين','أسطر','سطرًا')} يوميًا)`;
}

    fdate=addDays(today,days);
    rows+=`<div class="fcrow"><span class="k">معدل الحفظ الأسبوعي</span><span class="v">${dec(pace.pagesPerWeek,1)} وجه</span></div>
      <div class="fcrow"><span class="k">${forLabel?esc(forLabel):'الموعد المتوقع'}</span><span class="v">${fmtDate(fdate)} <small>(خلال ${spanText(days)})</small></span></div>`;
  }
  if(target)rows+=`<div class="fcrow"><span class="k">الموعد المستهدف</span><span class="v">${fmtDate(target)}</span></div>`;
  let h=`<div class="fcstats">${rows}</div>`;
  if(target&&fdate){
    const diff=dayDiff(target,fdate),left=dayDiff(today,target);
    if(diff<=-2)h+=`<p class="tgt"><span class="tag ok">متقدّم</span> على الموعد المستهدف بنحو ${daysText(-diff)}.</p>`;
    else if(diff>=2){
      h+=`<p class="tgt"><span class="tag late">متأخر</span> عن الموعد المستهدف بنحو ${daysText(diff)}.</p>`;
      if(left>0){const ct=catchUpText(remainingPages,left);if(ct)h+=`<p class="tgt muted">للحاق بموعدك، تحتاج نحو ${ct}.</p>`;}
    }else h+=`<p class="tgt"><span class="tag mid">في الموعد</span> أنت قريب جدًا من موعدك المستهدف.</p>`;
    if(left<=0)h+=`<p class="tgt muted">${left===0?'الموعد المستهدف هو اليوم.':'مضى الموعد المستهدف.'}</p>`;
  }
  return h;
}

/* شريط أرباع القرآن البصري بترتيب رحلة الحفظ (يبدأ بعمّ وينتهي بالبقرة والفاتحة)، كل ربع مقسّم لأجزائه */
const QUARTER_STRUCT=[[24,30],[16,23],[8,15],[1,7]]; // أرقام الأجزاء (١-فهرسة) لكل ربع بترتيب الحفظ لا المصحف
function quarterBarHTML(d){
  const curJuz1=d.curJuz+1;
  let qi=3;
  QUARTER_STRUCT.forEach(([j0,j1],idx)=>{if(curJuz1>=j0&&curJuz1<=j1)qi=idx;});
  const names=['الربع الأول','الربع الثاني','الربع الثالث','الربع الرابع'];
  let cells='';
  for(let q=0;q<4;q++){
    const [j0,j1]=QUARTER_STRUCT[q];
    let mini='';
    for(let j=j1;j>=j0;j--){
      const done=d.jc[j-1]>=JSIZE[j-1];
      const part=!done&&d.jc[j-1]>0;
      mini+=`<i class="${done?'done':part?'part':''}"${part?` style="--p:${(d.jc[j-1]/JSIZE[j-1]*100).toFixed(0)}%"`:''}></i>`;
    }
    cells+=`<div class="qcell qsplit${q===qi?' cur':''}">${mini}</div>`;
  }
  return `<div class="qwrap"><div class="qbar">${cells}</div>
    <div class="qlabels"><span>${names[0]}</span><span>${names[1]}</span><span>${names[2]}</span><span>${names[3]}</span></div></div>`;
}

/* ═══════════════ اختيار الآيات من المصحف (جزء عمّ) ═══════════════ */
const MUSHAF_MIN=1,MUSHAF_MAX=604;
function mpBtn(t){return `<button type="button" class="btn btn-ghost btn-block" style="margin-top:6px" data-act="mp-open" data-target="${t}">📖 اختيار الآيات من المصحف</button>`;}
/* يقرأ الحقول الحالية للنافذة الأم ويعيد {s,from} (السورة ١-فهرسة) أو {err} */
function mpContext(target){
  const S=UI.sheet;
  if(target==='ph')return {s:+$('#ph-s').value,from:parseNum($('#ph-from').value)||1};
  if(target==='pr')return {s:+$('#pr-rsurah').value,from:parseNum($('#pr-from').value)||1};
  if(target==='lg'){readLog();return {s:S.s,from:S.from||1};}
  if(target==='ed'){readEdit();return {s:S.s,from:S.from||1};}
  if(target==='rl'){readReviewLog();return {s:S.s,from:S.from||1};}
  if(target==='pa'){priorRanges();return {s:S.fs,from:S.fa||1};}
  return {err:'غير مدعوم'};
}
function openMushafPicker(target){
  const c=mpContext(target);
  let orig;
  if(target==='ph')orig={date:$('#ph-date').value,s:+$('#ph-s').value,from:parseNum($('#ph-from').value)||1,to:parseNum($('#ph-to').value)||1};
  else if(target==='pr')orig={date:$('#pr-date').value,surah:+$('#pr-rsurah').value,from:parseNum($('#pr-from').value)||1,to:parseNum($('#pr-to').value)||1};
  else orig=Object.assign({},UI.sheet);
  let page=MUSHAF_MIN;
  {const idx=gi(c.s,Math.min(Math.max(1,c.from),COUNTS[c.s-1]));const p=PAGE_OF[idx]+1;if(p>=MUSHAF_MIN&&p<=MUSHAF_MAX)page=p;}
  openSheet({type:'mushaf-picker',page,selA:null,selB:null,target,orig});
}
function mpPointLabel(idx){return NAMES[SURAH_OF[idx]]+' آية '+AYAH_OF[idx];}
function mpRangeIdx(S){
  if(!S.selA)return null;
  const a=gi(S.selA.s,S.selA.a),b=S.selB?gi(S.selB.s,S.selB.a):a;
  return [Math.min(a,b),Math.max(a,b)];
}
function mpSplitAyahNum(text){
  const m=text.match(/^(.*?)([٠-٩]+)\s*$/);
  return m?{body:m[1].trim(),num:m[2]}:{body:text,num:null};
}
function mushafPickerHTML(S){
  const ro=S.type==='page-view';

  lines.forEach(ln=>{
    if(ln.t==='h')body+=`<div class="mp-surah-banner"><span class="mp-surah-txt">${esc(ln.name.replace(/[\u064B-\u065F\u0670\u06D6-\u06ED]/g,'').replace(/ٱ/g,'ا'))}</span></div>`;
    else if(ln.t==='b')body+=`<div class="mp-basmala">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>`;
    else{
      const r=mpRangeIdx(S);

    <button type="button" class="mp-nav" data-act="mp-next"${S.page>=MUSHAF_MAX?' disabled':''}>التالي ›</button>

    <div class="mp-sel-row"><span>من:</span><b>${esc(fromTxt)}</b></div>
    <div class="mp-sel-row"><span>إلى:</span><b>${esc(toTxt)}</b></div>
  </div>

    <button type="button" class="btn btn-ghost btn-block" data-act="mp-cancel">إلغاء</button>
  </div>`}`;
}
function mpCancel(){

/* تحديث محتوى شاشة المصحف فقط دون إعادة بناء النافذة (لا حركة دخول ولا وميض للخلفية) */
function mpRefresh(o){
  o=o||{};

  if(!sb||!UI.sheet||(UI.sheet.type!=='mushaf-picker'&&UI.sheet.type!=='page-view')){paintSheet();return;}

  sb.scrollTop=sbTop;

function mpConfirm(){
  const S=UI.sheet,r=mpRangeIdx(S);if(!r)return;

  const from=AYAH_OF[a],to=sB===sA?AYAH_OF[b]:COUNTS[sA-1];

/* نص تاريخ نسبي: اليوم / أمس / قبل N يوم */
function relDate(dateStr){
  const n=dayDiff(dateStr,todayISO());
  if(n<=0)return 'اليوم';
  if(n===1)return 'أمس';
  return 'قبل '+daysText(n);
}
/* نص تاريخ نسبي مستقبلي: اليوم / غدًا / بعد N يوم / قبل N يوم (لو تجاوز) */
function planRelDate(dateStr){
  const n=dayDiff(todayISO(),dateStr);
  if(n===0)return 'اليوم';
  if(n===1)return 'غدًا';
  if(n>1)return 'بعد '+daysText(n);
  if(n===-1)return 'أمس';
  return 'قبل '+daysText(-n);
}

function weeklyPaceData(d){
  if(!d.ptl.length)return null;
  const first=d.ptl[0].date,today=todayISO();
  const weeks=Math.max(1,Math.ceil((dayDiff(first,today)+1)/7));
  const buckets=new Array(weeks).fill(0);
  let prev=d.priorPagesTotal;
  d.ptl.forEach(p=>{
    const delta=p.pages-prev;prev=p.pages;
    const wi=Math.min(weeks-1,Math.floor(dayDiff(first,p.date)/7));
    buckets[wi]+=delta;
  });
  return {first,buckets};
}
/* مخطط أعمدة أسبوعي يُظهر الهمّة (بالصفحات، معروضة كـ"وجه")، مع خط "المعدل المطلوب" إن وُجد موعد مستهدف */
function weeklyBarsSVG(d,requiredPace){
  const wd=weeklyPaceData(d);if(!wd)return '';
  let buckets=wd.buckets,first=wd.first;
  const showN=10;
  if(buckets.length>showN){first=addDays(first,(buckets.length-showN)*7);buckets=buckets.slice(-showN);}
  const W=340,H=158,pl=34,pr=14,pt=22,pb=26;
  const actualMax=Math.max(...buckets,0.5);
  const offScale=requiredPace&&requiredPace>actualMax*1.3;
  const maxV=(offScale?actualMax*1.3:Math.max(actualMax,requiredPace||0))*1.18;
  const bw=(W-pl-pr)/buckets.length;
  const Y=v=>H-pb-(v/maxV)*(H-pt-pb);
  let bars='';
  buckets.forEach((v,i)=>{
    const x=pl+i*bw+bw*0.16,w=bw*0.68,y=Y(v),ht=Math.max(v>0?2:0,(H-pb)-y);
    const col=requiredPace?(v>=requiredPace?'var(--ok)':'var(--danger)'):'var(--gold)';
    bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${ht.toFixed(1)}" rx="3" fill="${col}"/>`;
  });
  let ref='';
  if(requiredPace){
    if(offScale){
      ref=`<line x1="${pl}" y1="${pt-6}" x2="${W-pr}" y2="${pt-6}" stroke="var(--ink)" stroke-dasharray="4 3" stroke-width="1.4"/>
        <text x="${W-pr}" y="${pt-10}" text-anchor="start" font-weight="700" font-size="9.5">المطلوب: ${pagesToWajhText(requiredPace)} ↑</text>`;
    }else{
      const y=Y(requiredPace).toFixed(1);
      const ly=((+y-12)>=pt?(+y-12):(+y+16)).toFixed(1);
      ref=`<line x1="${pl}" y1="${y}" x2="${W-pr}" y2="${y}" stroke="var(--ink)" stroke-dasharray="4 3" stroke-width="1.4"/>
        <text x="${W-pr}" y="${ly}" text-anchor="start" font-size="9.5">المطلوب: ${pagesToWajhText(requiredPace)}</text>`;
    }
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="مقدار الحفظ كل أسبوع">
    ${ref}${bars}
    <text x="${pl}" y="${H-8}" text-anchor="end">${fmtShort(first)}</text>
    <text x="${W-pr}" y="${H-8}" text-anchor="start">اليوم</text></svg>`;
}
/* جملة توضح السرعة بلغة مباشرة: بطيء/جيد/ممتاز، ومتى يكتمل الجزء بهذا المعدل */
function paceHeadlineHTML(st,d){
  const pace=paceOf(st,d),gj=st.goal.juz,gPages=JUZ_PAGES[gj],gHave=Math.min(gPages,d.juzPages(gj)),gLeft=Math.max(0,gPages-gHave);
  if(gLeft<=0)return {html:`<p class="pace-h ok">أتممت هذا الهدف، بارك الله فيك.</p>`,requiredPace:null};
  if(!pace.ok)return {html:pace.reason==='idle'?`<p class="pace-h muted">لم تُسجَّل جلسات جديدة في آخر 30 يومًا، فلا يمكن قياس همّتك الحالية.</p>`:'',requiredPace:null};
  const days=Math.ceil(gLeft/pace.pagesPerWeek*7);
  let requiredPace=null,msg,cls;
  if(st.goal.target){
    const daysLeft=dayDiff(todayISO(),st.goal.target);
    if(daysLeft>0)requiredPace=gLeft/daysLeft*7;
    if(daysLeft<=0){msg=`تجاوزت الموعد المستهدف. بهذه الهمّة ستكمل ${juzTitle(gj)} خلال ${spanText(days)} تقريبًا.`;cls='slow';}
    else if(days<=daysLeft*0.9){msg=`ممتاز، همّتك تكفي لإتمام ${juzTitle(gj)} قبل موعدك المستهدف.`;cls='fast';}
    else if(days<=daysLeft*1.15){msg=`همّتك جيدة، ستكمل ${juzTitle(gj)} قريبًا من موعدك المستهدف.`;cls='ok';}
    else{msg=`أبطأ من المطلوب: بهذه الهمّة ستكمل ${juzTitle(gj)} خلال ${spanText(days)} تقريبًا بدل ${spanText(daysLeft)} المتبقية على موعدك.`;cls='slow';}
  }else{
    msg=`لم تحدد موعدًا مستهدفًا بعد. بهذه الهمّة ستكمل ${juzTitle(gj)} خلال ${spanText(days)} تقريبًا.`;cls='ok';
  }
  return {html:`<p class="pace-h ${cls}"><b>${pagesToWajhText(pace.pagesPerWeek)}</b> في الأسبوع — ${msg}</p>`,requiredPace};
}

/* ═══════════════ قائمة اختيار الأجزاء/السور (الحفظ السابق + الترحيب) ═══════════════ */
function portionsOf(j){
  const out=[];let i=JS[j];
  while(i<=JE[j]){
    const s=SURAH_OF[i];let k=i;
    while(k<=JE[j]&&SURAH_OF[k]===s)k++;
    out.push({s,a0:AYAH_OF[i],a1:AYAH_OF[k-1],i0:i,i1:k-1,n:k-i});
    i=k;
  }
  return out;
}
const isFull=(d,a,b)=>{if(!d)return false;for(let i=a;i<=b;i++)if(!d.mem[i])return false;return true;};
function pickerHTML(d){
  let h='<div class="pk">';
  for(let j=29;j>=0;j--){
    const rows=portionsOf(j).map(p=>{
      const full=isFull(d,p.i0,p.i1);
      const label=(p.a0===1&&p.a1===COUNTS[p.s])?NAMES[p.s]:NAMES[p.s]+' '+p.a0+'–'+p.a1;
      return `<label class="pk-row"><input type="checkbox" data-a="${p.i0}" data-b="${p.i1}"${full?' checked disabled':''}><span>${esc(label)}</span><small>${full?'محفوظ':ayahsTxt(p.n)}</small></label>`;
    }).join('');
    h+=`<div class="pk-j" data-j="${j}"><div class="pk-h">
      <label class="pk-all"><input type="checkbox" data-all="1" aria-label="${esc(juzTitle(j))} كاملًا"></label>
      <button type="button" class="pk-x" data-act="pk-toggle" aria-expanded="false"><span class="tt"><b class="t">${esc(juzTitle(j))}</b><small class="s">يبدأ من ${NAMES[SURAH_OF[JS[j]]]}</small></span><span class="c"></span>${CHEV}</button>
    </div><div class="pk-b" hidden>${rows}</div></div>`;
  }
  return h+'</div>';
}
function pkSyncJuz(el){
  const boxes=[...el.querySelectorAll('.pk-row input')],on=boxes.filter(b=>b.checked).length;
  const all=el.querySelector('[data-all]');
  all.checked=boxes.length>0&&on===boxes.length;all.indeterminate=on>0&&on<boxes.length;
  all.disabled=boxes.length>0&&boxes.every(b=>b.disabled);
  el.querySelector('.c').textContent=on===0?'':on===boxes.length?'كامل':on+' من '+boxes.length+' سور';
  el.classList.toggle('has',on>0);
}
const pkSyncAll=()=>document.querySelectorAll('.pk-j').forEach(pkSyncJuz);
function pkRanges(root){
  const sel=[...(root||document).querySelectorAll('.pk-row input:checked:not(:disabled)')].map(b=>[+b.dataset.a,+b.dataset.b]).sort((x,y)=>x[0]-y[0]);
  const out=[];
  sel.forEach(r=>{const l=out[out.length-1];if(l&&r[0]===l[1]+1)l[1]=r[1];else out.push([r[0],r[1]]);});
  return out;
}
function calcNewRanges(ranges,mem){
  let n=0,nw=0;
  ranges.forEach(([a,b])=>{n+=b-a+1;for(let i=a;i<=b;i++)if(!mem||!mem[i])nw++;});
  return {n,nw};
}

function mpFitLines(){
  const lines=[...document.querySelectorAll('.mp-line')];
  if(!lines.length)return;
  const cw=lines[0].clientWidth;if(!cw)return;
  const BASE=30,natW=el=>{el.style.display='inline-block';const w=el.getBoundingClientRect().width;el.style.display='';return w;};
  lines.forEach(el=>{el.style.wordSpacing='0px';el.style.textAlign='start';el.style.fontSize=BASE+'px';});
  let fs=BASE;
  lines.forEach(el=>{const w=natW(el);if(w>0)fs=Math.min(fs,BASE*cw/w);});
  fs=Math.max(Math.min(fs*0.985,26),8);
  lines.forEach(el=>{el.style.fontSize=fs+'px';});
  for(let k=0;k<6;k++){
    let worst=1;lines.forEach(el=>{worst=Math.max(worst,el.scrollWidth/cw);});
    if(worst<=1)break;
    fs=Math.max(fs/worst*0.99,6);lines.forEach(el=>{el.style.fontSize=fs+'px';});
  }
  lines.forEach(el=>{
    const w=natW(el),gaps=(el.textContent.match(/ /g)||[]).length;
    if(w<cw&&gaps>0){
      if(w/cw>=0.72){
        let ws=Math.max(0,(cw-w-3)/gaps);el.style.wordSpacing=ws+'px';
        for(let k=0;k<4&&el.scrollWidth>cw;k++){ws=Math.max(0,ws-(el.scrollWidth-cw)/gaps-0.3);el.style.wordSpacing=ws+'px';}
      }else el.style.textAlign='center';
    }
  });
}

function readLog(){const S=UI.sheet;S.s=+$('#f-surah').value;S.from=parseNum($('#f-from').value);S.to=parseNum($('#f-to').value);S.date=$('#f-date').value;}
function calcNew(a,b,excludeId){
  const m=UI.d.mem;let n=0;
  for(let i=a;i<=b;i++){
    if(!m[i]){n++;continue;}
    if(excludeId){const st=cur();const r=st.records.find(x=>x.id===excludeId);if(r&&i>=r.start&&i<=r.end)n++;}
  }
  return n;
}
function updateLog(){
  readLog();
  const S=UI.sheet,max=COUNTS[S.s-1],box=$('#log-preview'),btn=$('#log-save');
  let msg='',ok=true;
  if(!(S.from>=1)||!(S.to>=1)){ok=false;msg='أدخل رقم آية البداية وآية النهاية.';}
  else if(S.from>max||S.to>max){ok=false;msg='سورة '+surahName(S.s)+' فيها '+ayahsTxt(max)+' فقط.';}
  else if(S.from>S.to){ok=false;msg='آية البداية يجب أن تكون قبل آية النهاية أو مثلها.';}
  else if(!validDate(S.date)||S.date>todayISO()){ok=false;msg='اختر تاريخًا صحيحًا لا يتجاوز اليوم.';}
  if(ok){
    const a=gi(S.s,S.from),b=gi(S.s,S.to),n=b-a+1,nw=calcNew(a,b);
    if(nw===0){ok=false;msg='كل آيات هذا النطاق محسوبة في حفظك من قبل.';}
    else{
      const after=(UI.d.total+nw)/TOTAL*100;
      msg=`تسجيل ${ayahsTxt(n,true)}: <b>${esc(rangeLabel(a,b))}</b>.`+(nw<n?` الجديد منها ${ayahsTxt(nw,true)}.`:'')+` ستصبح نسبة حفظك ${pctText(after)}%.`;
    }
  }
  box.innerHTML=ok?msg:esc(msg);box.classList.toggle('err',!ok);btn.disabled=!ok;
}
function setLog(from,to){$('#f-from').value=from;$('#f-to').value=to;updateLog();}
function logSave(){
  updateLog();if($('#log-save').disabled)return;
  const S=UI.sheet,st=cur(),before=UI.d.jdone.map(Boolean);
  st.records.push({id:uid(),type:'session',start:gi(S.s,S.from),end:gi(S.s,S.to),date:S.date,createdAt:Date.now()});
  if(S.planRef)markPlanDone(S.planRef.itemId);
  save();
  const d2=derive(st);
  const newly=[];d2.jdone.forEach((x,j)=>{if(x&&!before[j])newly.push(j);});
  const n=S.to-S.from+1;
  closeSheet();render();
  if(newly.length||d2.total===TOTAL) openSheet({type:'cele',newly,goalDone:newly.includes(st.goal.juz),quran:d2.total===TOTAL,date:S.date});
  else toast('تم تسجيل '+ayahsTxt(n,true));
}

function memorizedBoundsInPortion(d,p){
  let lo=null,hi=null;
  for(let i=p.i0;i<=p.i1;i++){if(d.mem[i]){if(lo===null)lo=i;hi=i;}}
  return lo===null?null:{lo:AYAH_OF[lo],hi:AYAH_OF[hi]};
}

function readReviewLog(){const S=UI.sheet;if(!S.whole){S.s=+$('#rl-surah').value;S.from=parseNum($('#rl-from').value);S.to=parseNum($('#rl-to').value);}S.date=$('#rl-date').value;}
function reviewLogRange(){
  const S=UI.sheet;
  if(S.whole){
    if(!validDate(S.date)||S.date>todayISO())return{err:'اختر تاريخًا صحيحًا لا يتجاوز اليوم.'};
    return {a:JS[S.j],b:JE[S.j]};
  }
  const p=portionsOf(S.j).find(x=>x.s+1===S.s);
  if(!p)return{err:'اختر سورة ضمن هذا الجزء.'};
  let loA=p.a0,hiA=p.a1;
  if(S.near){
    const b=memorizedBoundsInPortion(UI.d,p);
    if(!b)return{err:'لم تُحفظ بعد أي آية من هذه السورة ضمن هذا الجزء.'};
    loA=b.lo;hiA=b.hi;
  }
  if(!(S.from>=1)||!(S.to>=1))return{err:'أدخل رقم آية البداية وآية النهاية.'};
  if(S.from<loA||S.to>hiA)return{err:'هذا النطاق خارج حدود '+NAMES[p.s]+(S.near?' المحفوظة حتى الآن':' في هذا الجزء')+' ('+loA+'–'+hiA+').'};
  if(S.from>S.to)return{err:'آية البداية يجب أن تكون قبل آية النهاية أو مثلها.'};
  if(!validDate(S.date)||S.date>todayISO())return{err:'اختر تاريخًا صحيحًا لا يتجاوز اليوم.'};
  return {a:gi(S.s,S.from),b:gi(S.s,S.to)};
}

function computeBadges(stu){
  if(!stu)return [];
  const att=DATA.attendance.filter(a=>a.studentId===stu.id);
  const hasAny=att.length>0,hasAbsence=att.some(a=>a.status==='absent');
  const today=todayISO(),weekStart=addDays(today,-6);
  const weekAtt=att.filter(a=>a.date>=weekStart&&a.date<=today);
  const weekHasAbsence=weekAtt.some(a=>a.status==='absent'),weekHasPresent=weekAtt.some(a=>a.status==='present');
  let starEarned=false;
  try{
    const paces=DATA.students.map(s=>{
      const pl=s.places&&s.places[0];if(!pl)return {id:s.id,pace:0};
      const dd=derive(pl),p=paceOf(pl,dd);
      return {id:s.id,pace:p.ok?p.pagesPerWeek:0};
    });
    const max=Math.max(0,...paces.map(p=>p.pace));
    const mine=paces.find(p=>p.id===stu.id);
    starEarned=!!(max>0&&mine&&mine.pace===max);
  }catch(e){}
  return [
    {key:'commit',label:'وسام الالتزام',desc:'لم يغب عن أي حصة مسجَّلة في سجل الحضور',earned:hasAny&&!hasAbsence},
    {key:'star',label:'وسام نجم الحلقة',desc:'الأعلى همّة حفظ بين الطلاب هذا الأسبوع',earned:starEarned},
    {key:'week',label:'وسام حضور أسبوع بدون غياب',desc:'حضر طوال آخر 7 أيام دون أي غياب',earned:weekHasPresent&&!weekHasAbsence}
  ];
}
function badgesHTML(stu){
  const badges=computeBadges(stu);
  return `<div class="sec-h"><h2>الأوسمة</h2></div>
    <div class="donegrid">${badges.map(b=>`<div class="pchip2${b.earned?' earned':''}" title="${esc(b.desc)}"><span class="f">${esc(b.label)}</span><span class="s">${b.earned?'مُحقَّق':'غير محقَّق'}</span></div>`).join('')}</div>`;
}

async function backupExport(){
  const data=JSON.stringify(DATA,null,2);
  const filename='quran-tracker-backup-'+todayISO()+'.json';
  try{
    if(window.claude&&window.claude.use){
      const downloads=await window.claude.use('downloads');
      if(downloads){await downloads.save({filename,data});toast('جارٍ تنزيل النسخة الاحتياطية');return;}
    }
  }catch(e){}
  try{
    const blob=new Blob([data],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1000);
    toast('جارٍ تنزيل النسخة الاحتياطية');
  }catch(e){toast('تعذّر التنزيل، استخدم نسخ النص بدلًا من ذلك');}

  'plan-choose-pick':el=>{
    const k=el.dataset.k;
    if(k==='hifz'){
      const d=UI.d;let s=1,from=1,to=COUNTS[0];
      if(d.next>=0){s=SURAH_OF[d.next]+1;from=AYAH_OF[d.next];to=Math.min(from+9,COUNTS[s-1]);}
      openSheet({type:'plan-add-hifz',date:todayISO(),s,from,to});
    }else openSheet({type:'plan-add-review',date:todayISO(),mode:'juz',juz:0,surah:1,from:1,to:1});
  },
  'plan-item-del':el=>planItemDeleteConfirm(el.dataset.id),
  'plan-log':el=>planLog(el.dataset.id),
  'plan-hifz-save':planHifzSave,
  'plan-review-mode':el=>{
    const S=UI.sheet,m=el.dataset.m;
    const de=$('#pr-date');if(de)S.date=de.value;
    if(S.mode==='surah'){const el2=$('#pr-surah');if(el2)S.surah=+el2.value;}
    else if(S.mode==='range'){const el2=$('#pr-rsurah');if(el2)S.surah=+el2.value;const fe=$('#pr-from');if(fe)S.from=parseNum(fe.value)||1;const te=$('#pr-to');if(te)S.to=parseNum(te.value)||1;}
    else{const el2=$('#pr-juz');if(el2)S.juz=+el2.value;}
    S.mode=m;
    if(m==='surah'&&!S.surah)S.surah=1;
    if(m==='range'){if(!S.surah)S.surah=1;if(!S.from)S.from=1;if(!S.to)S.to=COUNTS[S.surah-1];}
    if(m==='juz'&&S.juz==null)S.juz=0;
    paintSheet();
  },
  'plan-review-save':planReviewSave,
  'mp-open':el=>{
    const target=el.dataset.target,c=mpContext(target);
    if(c.err){toast(c.err);return;}
    const go=()=>{if(UI.sheet&&UI.sheet.type!=='mushaf-picker')openMushafPicker(target);};
    if(MUSHAF_PAGES){go();return;}
    toast('جارٍ تحميل المصحف…');
    loadMushaf().then(go).catch(()=>toast('تعذّر تحميل المصحف على هذا المتصفح. حدّث المتصفح أو أدخل أرقام الآيات يدويًا.'));
  },
  'page-view':el=>{
    const page=+el.dataset.page;
    const go=()=>{if(!UI.sheet)openSheet({type:'page-view',page,readonly:true});};
    if(MUSHAF_PAGES){go();return;}
    toast('جارٍ تحميل المصحف…');
    loadMushaf().then(go).catch(()=>toast('تعذّر تحميل المصحف على هذا المتصفح. حدّث المتصفح.'));
  },
  'mp-tap':el=>mpTap(+el.dataset.s,+el.dataset.a),
  'mp-prev':()=>mpNav(-1),
  'mp-next':()=>mpNav(1),
  'mp-ok':mpConfirm,
  'mp-cancel':mpCancel,
  'review-period':el=>{UI.reviewPeriod=el.dataset.p;render();},
  'open-review-edit':el=>openConfirmDeleteReview(el.dataset.id,el.dataset.back!==undefined?+el.dataset.back:null),
  'confirm-no':()=>{const S=UI.sheet;if(S&&S.onNo)S.onNo();else closeSheet();},
  'review-juz30-log':reviewJuz30Log,
  'open-edit':el=>openEdit(el.dataset.id),
  'open-backup':()=>openSheet({type:'backup'}),
  'sync-new':()=>syncCreate($('#sync-code').value),
  'sync-connect':()=>syncConnect($('#sync-code').value),
  'sync-change-open':()=>openSheet({type:'sync-change'}),
  'sync-change-save':syncChange,
  'sync-join':syncJoin,
  'welcome-new':()=>{UI.welcome='new';render();pkSyncAll();updateOb();},
  'welcome-join':()=>{UI.welcome='join';render();},
  'welcome-back':()=>{UI.welcome='choice';render();},
  'sync-info':()=>{const b=$('#sync-info-box');if(b)b.hidden=!b.hidden;},
  'hist-info':()=>{const b=$('#hist-info-box');if(b)b.hidden=!b.hidden;},
  'pg-info':()=>{const b=$('#pg-info-box');if(b)b.hidden=!b.hidden;},
  'sync-disconnect':()=>{syncStop();render();toast('تم إيقاف المزامنة.');},
  'sync-use-cloud':()=>{const code=UI.sheet.code;syncStart(code);closeSheet();toast('تم الاتصال، وتم استخدام بيانات السحابة.');},
  'close-sheet':closeSheet,
  'step':el=>{
    const inp=$('#'+el.dataset.t);let v=parseNum(inp.value);if(!(v>=1))v=1;
    v=Math.max(1,v+(+el.dataset.d));inp.value=v;
    const S=UI.sheet;if(S.type==='log')updateLog();else if(S.type==='edit')updateEdit();else if(S.type==='review-log')updateReviewLog();else if(S.type==='plan-add-hifz')updatePlanHifz();else if(S.type==='plan-add-review')updatePlanReview();else updatePrior();
  },
  'log-amount':el=>{
    updateLog();const S=UI.sheet,max=COUNTS[S.s-1];
    const from=S.from>=1&&S.from<=max?S.from:1;
    const to=el.dataset.n==='end'?max:Math.min(from+(+el.dataset.n)-1,max);
    setLog(from,to);
  },
  'log-save':logSave,
  'edit-save':editSave,
  'edit-delete':()=>deleteRecord(UI.sheet.rec.id,true),
  'prior-mode':el=>{UI.sheet.mode=el.dataset.m;paintSheet();},
  'prior-save':priorSave,
  'goal-juz-save':goalJuzSave,
  'target-mode':el=>{UI.sheet.mode=el.dataset.m;paintSheet();},
  'target-save':targetSave,
  'target-clear':targetClear,
  'set-goal':el=>{const st=cur();st.goal={juz:+el.dataset.j,target:null};save();closeSheet();render();toast('تم تعيين الهدف القصير');},
  'student-select':el=>{DATA.selected=el.dataset.id;const s=DATA.students.find(x=>x.id===el.dataset.id);if(s&&el.dataset.place&&s.places.some(p=>p.id===el.dataset.place))s.selectedPlace=el.dataset.place;save();UI.tab='home';closeSheet();render();window.scrollTo(0,0);},
  'place-select':el=>{const s=curStudent();if(s){s.selectedPlace=el.dataset.place;save();}UI.tab='home';closeSheet();render();window.scrollTo(0,0);},
  'student-new':()=>{closeSheet();openSheet({type:'newstudent'});},
  'student-rename':()=>openSheet({type:'student',kind:'student',name:curStudent().name}),
  'place-rename':()=>openSheet({type:'student',kind:'place',name:cur().name}),
  'student-save':()=>{
    const name=$('#s-name').value.trim();
    if(!name){toast(UI.sheet.kind==='place'?'اكتب اسم الجهة':'اكتب اسم الطالب');return;}
    if(UI.sheet.kind==='place')cur().name=name.slice(0,40);else curStudent().name=name.slice(0,40);
    save();closeSheet();render();
  },
  'place-new':()=>{closeSheet();openSheet({type:'newplace'});},
  'place-new-for':el=>{DATA.selected=el.dataset.id;save();closeSheet();openSheet({type:'newplace'});},
  'student-delete':()=>{
    const stu=curStudent();
    confirmSheet({title:'حذف الطالب؟',msg:'سيُحذف «'+stu.name+'» مع كل سجلات حفظه وحضوره نهائيًا.',yes:'حذف الطالب',onYes:()=>{
      DATA.students=DATA.students.filter(s=>s.id!==stu.id);DATA.selected=DATA.students[0]?DATA.students[0].id:null;
      DATA.attendance=DATA.attendance.filter(a=>a.studentId!==stu.id);
      save();UI.tab='home';closeSheet();render();toast('تم حذف الطالب');}});
  },
  'place-delete':()=>{
    const stu=curStudent(),pl=cur();
    if(stu.places.length<=1){toast('لا يمكن حذف آخر جهة لهذا الطالب.');return;}
    confirmSheet({title:'حذف هذه الجهة؟',msg:'سيُحذف «'+pl.name+'» مع كل سجلاته نهائيًا (باقي جهات '+stu.name+' لن تتأثر).',yes:'حذف الجهة',onYes:()=>{
      stu.places=stu.places.filter(p=>p.id!==pl.id);stu.selectedPlace=stu.places[0].id;
      save();UI.tab='home';closeSheet();render();toast('تم حذف الجهة');}});
  },
  'confirm-yes':()=>{const f=UI.sheet.onYes;if(f)f();},
  'backup-export':backupExport,
  'backup-copy':backupCopy,
  'cele-goal':()=>{closeSheet();openSheet({type:'goal-juz',juz:cur().goal.juz});},
  'ob-go':obGo,
  'place-go':placeGo,
  'tbl-unit':el=>{UI.tblUnit=el.dataset.u;UI.tblOffset=0;render();},
  'tbl-nav':el=>{UI.tblOffset+=(+el.dataset.d);if(UI.tblOffset>0)UI.tblOffset=0;render();},
  'tbl-custom-mode':el=>{UI.tblCustomMode=el.dataset.m;render();},
  'tbl-custom-apply':()=>{
    if(UI.tblCustomMode==='count'){
      UI.tblCount=Math.max(1,Math.min(52,parseInt($('#tbl-count').value,10)||4));
      UI.tblCountUnit=$('#tbl-count-unit').value;
    }else{
      UI.tblFrom=$('#tbl-from').value||todayISO();UI.tblTo=$('#tbl-to').value||todayISO();
    }
    render();
  },
  'trend-settings-open':()=>openSheet({type:'trend-settings'}),
  'trend-mode':el=>{UI.trendMode=el.dataset.m;paintSheet();},
  'trend-apply':()=>{
    if(UI.trendMode==='dates'){
      UI.trendFrom=$('#trend-from').value||addDays(todayISO(),-49);UI.trendTo=$('#trend-to').value||todayISO();
      UI.trendUnit=$('#trend-bucket').value;
    }else{
      UI.trendCount=Math.max(1,Math.min(60,parseInt($('#trend-count').value,10)||8));
      UI.trendUnit=$('#trend-unit').value;
    }
    closeSheet();render();
  },
  'trend-metric':el=>{
    const k=el.dataset.k,cur=UI.trendMetric;
    let hasHifz=cur!=='review',hasReview=cur!=='hifz';
    if(k==='hifz')hasHifz=el.checked;else hasReview=el.checked;
    if(!hasHifz&&!hasReview){if(k==='hifz')hasReview=true;else hasHifz=true;}
    UI.trendMetric=hasHifz&&hasReview?'both':hasHifz?'hifz':'review';
    render();
  },
  'pk-toggle':el=>{
    const j=el.closest('.pk-j'),open=!j.classList.contains('open');
    j.classList.toggle('open',open);j.querySelector('.pk-b').hidden=!open;el.setAttribute('aria-expanded',String(open));
  },
  'theme-set':el=>setTheme(el.dataset.t),
  'teacher-rename':()=>openSheet({type:'teacher'}),
  'teacher-save':()=>{const name=$('#t-name').value.trim();DATA.teacherName=name.slice(0,40);save();closeSheet();render();toast('تم حفظ اسم المعلم');},
  'att-set':el=>{setAttendance(el.dataset.id,UI.attDate||todayISO(),el.dataset.status);render();},
  'att-delete':el=>{deleteAttendance(el.dataset.id);render();}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const f=ACT[el.dataset.act];if(f){e.preventDefault();f(el,e);}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='hdr-student'){
    if(t.value==='__new__'){openSheet({type:'newstudent'});render();return;}
    const s=DATA.students.find(x=>x.id===t.value);
    if(s){DATA.selected=s.id;save();render();window.scrollTo(0,0);}
    return;
  }
  if(t.id==='hdr-place'){
    if(t.value==='__newplace__'){openSheet({type:'newplace'});render();return;}
    const s=curStudent();
    if(s&&s.places.some(p=>p.id===t.value)){s.selectedPlace=t.value;save();render();window.scrollTo(0,0);}
    return;
  }
  if(t.id==='att-date'){UI.attDate=t.value||todayISO();render();return;}
  if(t.id==='att-month'){UI.attMonth=t.value||monthKeyOf(todayISO());render();return;}
  if(t.id==='backup-file')return backupFileChosen(t);
  if(t.matches&&t.matches('.pk input[type=checkbox]')){
    const j=t.closest('.pk-j');
    if(t.hasAttribute('data-all'))j.querySelectorAll('.pk-row input:not(:disabled)').forEach(b=>{b.checked=t.checked;});
    pkSyncJuz(j);
    if($('#ob-go'))updateOb();
    else if(UI.sheet&&UI.sheet.type==='prior')updatePrior();
    return;
  }
  const S=UI.sheet;if(!S)return;
  if(t.id==='ob-goal')return updateOb();
  if(S.type==='log'){
    if(t.id==='f-surah'){const s=+t.value,a=firstUnmem(s,UI.d);S.s=s;setLog(a,Math.min(a+9,COUNTS[s-1]));}
    else updateLog();
  }else if(S.type==='edit'){
    if(t.id==='e-surah'){S.s=+t.value;S.from=1;S.to=Math.min(10,COUNTS[S.s-1]);paintSheet();}
    else updateEdit();
  }else if(S.type==='prior'){
    if(t.id==='p-fs'){$('#p-fa').value=1;}
    if(t.id==='p-ts'){$('#p-ta').value=COUNTS[+t.value-1];}
    updatePrior();
  }else if(S.type==='target'){
    updateTarget();
  }else if(S.type==='review-log'){
    if(t.id==='rl-surah'){
      const s=+t.value,p=portionsOf(S.j).find(x=>x.s+1===s);S.s=s;
      if(p){
        if(S.near){const b=memorizedBoundsInPortion(UI.d,p);if(b){$('#rl-from').value=b.lo;$('#rl-to').value=b.hi;}}
        else{$('#rl-from').value=p.a0;$('#rl-to').value=p.a1;}
      }
    }
    updateReviewLog();
  }else if(S.type==='plan-add-hifz'){
    if(t.id==='ph-s'){$('#ph-from').value=1;$('#ph-to').value=COUNTS[+t.value-1];}
    updatePlanHifz();
  }else if(S.type==='plan-add-review'){
    if(t.id==='pr-rsurah'){const s=+t.value;$('#pr-from').value=1;$('#pr-to').value=COUNTS[s-1];}
    updatePlanReview();
  }
});
document.addEventListener('input',e=>{
  const S=UI.sheet;if(!S)return;const t=e.target;
  if(t.type==='checkbox'||t.tagName==='SELECT')return;
  if(S.type==='log')updateLog();
  else if(S.type==='edit')updateEdit();
  else if(S.type==='plan-add-hifz')updatePlanHifz();
  else if(S.type==='plan-add-review')updatePlanReview();
  else if(S.type==='prior'&&S.mode==='ayah')updatePrior();
  else if(S.type==='target'&&S.mode==='date')updateTarget();
  else if(S.type==='review-log')updateReviewLog();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&UI.sheet)closeSheet();});
(function(){
  let sx=0,sy=0,active=false;
  document.addEventListener('touchstart',e=>{
    const box=e.target.closest('#mp-pagebox');if(!box)return;
    active=true;sx=e.touches[0].clientX;sy=e.touches[0].clientY;
  },{passive:true});
  document.addEventListener('touchend',e=>{
    if(!active)return;active=false;
    const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){
      mpNav(dx<0?1:-1); /* RTL: سحب لليسار = التالي */
    }
  },{passive:true});
})();

render();
if(SYNC_CODE)syncStart(SYNC_CODE);
})();
</script>
</body>
</html>
